name: fe_player
description: "FE Player - Clean Futuristic White Glassmorphism Desktop, Mobile & Web Video Player and Downloader Suite"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Media Player Engine (libmpv hardware acceleration)
  media_kit: ^1.1.10
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.8
  media_kit_libs_macos_video: ^1.0.8
  media_kit_libs_android_video: ^1.3.8

  # Window & Acrylic Blur Effects for Windows & macOS
  flutter_acrylic: ^1.1.4
  window_manager: ^0.3.8

  # File dialog & interactions
  file_picker: ^8.0.0
  
  # State Management
  provider: ^6.1.2
  
  # UI & Icons
  cupertino_icons: ^1.0.6

  # Downloader Suite & File Storage
  youtube_explode_dart: ^2.2.1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  http: ^1.2.1
  intl: ^0.19.0
  screen_brightness: ^2.1.7
  volume_controller: ^3.4.4
  audio_service: ^0.18.17
  audio_session: ^0.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
